[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp-ag"
version = "0.3.6"
description = "Read-only Telegram MCP extension with native voice transcription"
readme = "README.md"
# The one version the installers put users on (PYTHON_VERSION) and CI tests. No
# upper bound: a cap only turns a newer Python into a hard pip error.
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "telegram-mcp-ag maintainers" }]
dependencies = [
  # v3.2.90 (2026-10-19). Moved from fbb374a (2026-07-31): ~80 upstream releases.
  # Must stay git+https, not an archive URL: upstream's install_guard refuses to
  # start unless the installer recorded a git or file source. The installers read
  # the SHA from this line and install from a downloaded copy, so users need no git.
  "telegram-mcp @ git+https://github.com/chigwell/telegram-mcp.git@6f169eacdd5582a291061ae15b4829029666f53c",
  # mcp 2.0.0 dropped mcp.server.fastmcp (FastMCP/Context), which the upstream
  # runtime imports directly, breaking every fresh install. Upstream itself now
  # requires mcp>=1.30,<2; the cap is repeated here so it survives if they relax it.
  "mcp[cli]>=1.30.0,<2.0.0",
  "python-dotenv>=1.1.0",
  # QR login from the chat. pypng is qrcode's pure-Python PNG writer, so our own
  # QR code needs no imaging library. (Pillow is installed anyway now -- upstream
  # requires it for photo tools -- but nothing of ours should start depending on it.)
  "qrcode>=8.0",
  "pypng>=0.20220715",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
telegram-mcp-ag = "telegram_mcp_ag.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
