[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp-ag"
version = "0.2.10"
description = "Read-only Telegram MCP extension with native voice transcription"
readme = "README.md"
# <3.14: nest_asyncio (unmaintained, used by our own login flow; the pinned
# upstream runtime dropped it) crashes under Python 3.14's rewritten
# asyncio.timeout with "RuntimeError: Timeout should be used inside a task".
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "telegram-mcp-ag maintainers" }]
dependencies = [
  "telegram-mcp @ git+https://github.com/chigwell/telegram-mcp.git@fbb374ae2d2c54b939f703d73c07acc2de8ea4b8",
  # Upstream pins no ceiling on mcp; mcp 2.0.0 dropped mcp.server.fastmcp
  # (FastMCP/Context), which the pinned upstream runtime imports directly,
  # breaking every fresh install. Cap below the break until upstream migrates.
  "mcp[cli]>=1.8.0,<2.0.0",
  "python-dotenv>=1.1.0",
  # Upstream dropped this from its own deps; our login flow (server.py) still
  # needs it directly, so pin it here instead of relying on a transitive pull.
  "nest-asyncio>=1.6.0",
  # QR login from the chat. pypng is qrcode's pure-Python PNG writer: it keeps
  # Pillow, a large compiled wheel, out of the bundle for one monochrome image.
  "qrcode>=8.0",
  "pypng>=0.20220715",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
telegram-mcp-ag = "telegram_mcp_ag.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
