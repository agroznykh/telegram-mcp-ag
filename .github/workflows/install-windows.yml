name: Windows install

# Runs on every pull request and decides inside whether there is work to do: this
# is a required check on main, and a workflow skipped by a `paths:` filter would
# leave it pending forever. A run that skips its steps reports success.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  install:
    runs-on: windows-latest
    steps:
      - name: Check whether the install is affected
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"
          if grep -qE '^(install\.ps1|pyproject\.toml|\.github/scripts/|\.github/workflows/install-windows\.yml)' <<<"$files"; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "Nothing the Windows install depends on changed, skipping."
          fi

      - uses: actions/checkout@v5
        if: steps.changes.outputs.run == 'true'

      - name: Run the install steps
        if: steps.changes.outputs.run == 'true'
        shell: powershell
        env:
          # The branch commit: the merge commit github.sha points to on a PR
          # is not guaranteed to be downloadable as an archive.
          TELEGRAM_MCP_AG_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/test-install-windows.ps1
