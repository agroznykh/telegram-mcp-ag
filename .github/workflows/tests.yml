name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The one version the installers use: PYTHON_VERSION in install.sh / install.ps1.
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ensure shellcheck is available (Linux)
        if: runner.os == 'Linux'
        run: command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: Ensure shellcheck is available (macOS)
        if: runner.os == 'macOS'
        run: command -v shellcheck >/dev/null || brew install shellcheck

      - name: Install PSScriptAnalyzer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      # Users have no compiler, so every compiled dependency needs a prebuilt
      # wheel on each OS. pyaes (pure Python, sdist only) and the upstream
      # source are the only packages allowed to build from source.
      - name: Check dependencies have prebuilt wheels
        run: python -m pip install --dry-run --only-binary ":all:" --no-binary "pyaes,telegram-mcp" .

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -v

  # The single required check on main: the matrix can change without touching the
  # branch protection settings.
  tests-passed:
    if: always()
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pytest.result }}" = "success"
